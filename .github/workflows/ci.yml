name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    uses: CCPBioSim/.github/.github/workflows/ci-test-conda.yaml@43d3ed06eb774dfa813173770888a15f554c70cc # 0.6.0
    permissions:
      contents: read
      checks: write
      statuses: write
    with:
      package: aiida_amber
      matrix: >-
        {
          "python": ["3.12", "3.13", "3.14"],
          "aiida": ["2.9.0", "2.9.1"],
          "ambertools": ["24"]
        }
      conda-packages: python={python} aiida-core={aiida} ambertools={ambertools}
      pytest-args: -s
      test-path: .
      timeout-minutes: 30

  lowest-dependencies:
    name: Lowest dependencies
    uses: CCPBioSim/.github/.github/workflows/ci-test-conda.yaml@43d3ed06eb774dfa813173770888a15f554c70cc # 0.6.0
    permissions:
      contents: read
      checks: write
      statuses: write
    with:
      package: aiida_amber
      matrix: >-
        {
          "python": ["3.12", "3.14"],
          "aiida": ["2.9.0"],
          "ambertools": ["24"]
        }
      conda-packages: python={python} aiida-core={aiida} ambertools={ambertools}
      lowest-dependencies: true
      coverage: false
      pytest-args: -s
      test-path: .
      timeout-minutes: 30

  docs:
    name: Docs
    uses: CCPBioSim/.github/.github/workflows/ci-docs.yaml@43d3ed06eb774dfa813173770888a15f554c70cc # 0.6.0
    permissions:
      contents: read
    with:
      python-versions: '["3.15"]'
      build-dir: build
      sphinx-opts: ""
      timeout-minutes: 15

  pre-commit:
    name: Pre-commit
    uses: CCPBioSim/.github/.github/workflows/ci-pre-commit.yaml@43d3ed06eb774dfa813173770888a15f554c70cc # 0.6.0
    permissions:
      contents: read
    with:
      python-version: "3.15"
      timeout-minutes: 15

  conda-build:
    name: Conda build
    uses: CCPBioSim/.github/.github/workflows/ci-conda-build.yaml@43d3ed06eb774dfa813173770888a15f554c70cc # 0.6.0
    permissions:
      contents: read
    with:
      channels: CCPBioSim,conda-forge
      python-versions: '["3.12"]'
      timeout-minutes: 45
