name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    uses: CCPBioSim/.github/.github/workflows/ci-test-conda.yaml@788b8c3e5892a90926a1ee933f029e445bd1dff4 # 0.5.0
    permissions:
      contents: read
      checks: write
      statuses: write
    with:
      package: aiida_amber
      matrix: >-
        {
          "python": ["3.12", "3.13", "3.14"],
          "aiida": ["2.9.0", "2.9.1"],
          "ambertools": ["24"]
        }
      conda-packages: python={python} aiida-core={aiida} ambertools={ambertools}
      pytest-args: -s
      test-path: .
      timeout-minutes: 30

  docs:
    name: Docs
    uses: CCPBioSim/.github/.github/workflows/ci-docs.yaml@788b8c3e5892a90926a1ee933f029e445bd1dff4 # 0.5.0
    permissions:
      contents: read
    with:
      python-versions: '["3.15"]'
      build-dir: build
      sphinx-opts: ""
      timeout-minutes: 15

  pre-commit:
    name: Pre-commit
    uses: CCPBioSim/.github/.github/workflows/ci-pre-commit.yaml@788b8c3e5892a90926a1ee933f029e445bd1dff4 # 0.5.0
    permissions:
      contents: read
    with:
      python-version: "3.15"
      timeout-minutes: 15
