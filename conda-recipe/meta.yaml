{% set name = "aiida-amber" %}
{% set version = "0.0.0" %}
{% set pyproject = load_file_data("../pyproject.toml", from_recipe_dir=True) %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  path: ..

build:
  noarch: python
  script: python -m pip install . -vv --no-deps
  entry_points:
    {% for script, target in pyproject["project"]["scripts"].items() %}
    - {{ script }}={{ target }}
    {% endfor %}

requirements:
  host:
    - python >=3.12
    - pip
    - flit-core >=4,<5
  run:
    - python {{ pyproject["project"]["requires-python"] }}
    {% for dependency in pyproject["project"]["dependencies"] %}
    - {{ dependency | lower }}
    {% endfor %}

test:
  imports:
    - aiida_amber
  commands:
    - aiida_sander --help
    - python -c "import aiida_amber; print(aiida_amber.__version__)"

about:
  home: https://github.com/CCPBioSim/aiida-amber
  license: MIT
  license_file: LICENSE
  summary: AiiDA plugin that wraps amber molecular dynamics executables
